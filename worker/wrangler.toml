name = "trading-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cron trigger — polls Discord every minute
[triggers]
crons = ["* * * * *"]

# KV namespace for storing last-seen Discord message IDs
[[kv_namespaces]]
binding = "BOT_STATE"
id = "991599d862df48a2a5e61c8161f83195"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# ── TradingView execution (src/tv/) ───────────────────────────────────────────
# RuleState serialises each rule's fire-slot. KV cannot do this: it has no
# compare-and-set, so two concurrent webhook deliveries would both see the rule
# armed and both trade. TradingView webhook delivery is at-least-once, so that
# is a real double-sell, not a theoretical one.
[[durable_objects.bindings]]
name = "RULE_STATE"
class_name = "RuleState"

[[migrations]]
tag = "v1-rule-state"
new_sqlite_classes = ["RuleState"]
